[project]
name = "paratia"
version = "1.0.0"
description = "Files an agent cannot read, enforced by the harness rather than requested in a prompt."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [{name = "Eugenio Nerelli"}]

# No runtime dependencies, on purpose. Every dependency is a maintainer who can
# push code onto this machine; the standard library is enough for this job.
dependencies = []

[project.scripts]
paratia = "paratia:main"
paratia-fanale = "fanale:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat modules, not a package. paratia.py loads specchio.py, etichette.py and
# finder.py by path from its own directory, so they have to land side by side.
# web/ ships too: `paratia finder` serves finder.html from it and a wheel without
# it installs a command that 500s on its first request. GUI helpers and their two
# scripts stay together too. Shipping a hook does not activate it: the native
# app offers a separate, reversible configuration step.
only-include = ["paratia.py", "specchio.py", "fanale.py", "catena.py", "etichette.py", "finder.py", "cartelle.py", "registro.py", "registro_daemon.py", "registro_installa.py", "gui_worker.py", "banco.py", "hookinstaller.py", "hooks/paratia-gate.py", "strumenti/banco-probe.py", "web"]
