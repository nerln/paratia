<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Paratia</title>
  <desc id="description">Una cartella sigillata da un portello stagno con volantino, su un quadrato blu petrolio arrotondato.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315b64"/>
      <stop offset="1" stop-color="#15363f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f2f1e8"/>
      <stop offset="1" stop-color="#acbec0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dce3df"/>
      <stop offset="1" stop-color="#9fbbbc"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e7b76d"/>
      <stop offset="1" stop-color="#bd8444"/>
    </linearGradient>
  </defs>
  <!-- The inset leaves the same transparent breathing room as native macOS icons. -->
  <rect x="48" y="62" width="928" height="928" rx="208" fill="#071e25" opacity=".16"/>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#background)"/>
  <rect x="56" y="56" width="912" height="912" rx="200" fill="none" stroke="#719195" stroke-opacity=".34" stroke-width="8"/>
  <!-- The tab and wide face suggest a folder; its contents are behind the hatch. -->
  <path d="M254 217 Q254 193 278 193 H411 Q435 193 451 213 L479 247 H736 Q780 247 780 291 V757 Q780 801 736 801 H288 Q244 801 244 757 V274 Q244 259 254 251 Z" fill="#0c2e37" opacity=".38" transform="translate(0 18)"/>
  <path d="M254 217 Q254 193 278 193 H411 Q435 193 451 213 L479 247 H736 Q780 247 780 291 V757 Q780 801 736 801 H288 Q244 801 244 757 V274 Q244 259 254 251 Z" fill="url(#rim)"/>
  <rect x="282" y="279" width="460" height="484" rx="49" fill="#34555d"/>
  <rect x="299" y="296" width="426" height="450" rx="36" fill="url(#door)"/>
  <path d="M331 330 H693" stroke="#f4f4ec" stroke-width="12" stroke-linecap="round" opacity=".65"/>
  <!-- Two hinges are visible even when the icon is small. -->
  <rect x="261" y="364" width="52" height="92" rx="14" fill="#f0f1e8"/>
  <rect x="261" y="587" width="52" height="92" rx="14" fill="#c3d0cd"/>
  <rect x="274" y="374" width="10" height="72" rx="5" fill="#759296"/>
  <rect x="274" y="597" width="10" height="72" rx="5" fill="#759296"/>
  <!-- The wheel is one strong silhouette, with broad spokes and an amber rim. -->
  <circle cx="524" cy="533" r="126" fill="none" stroke="#617e81" stroke-width="35" opacity=".33"/>
  <g stroke="#2a4a53" stroke-linecap="round">
    <path d="M524 415 V645 M421 587 L626 469 M421 469 L626 587" stroke-width="30"/>
    <circle cx="524" cy="527" r="119" fill="none" stroke-width="52"/>
  </g>
  <circle cx="524" cy="522" r="118" fill="none" stroke="url(#wheel)" stroke-width="30"/>
  <circle cx="524" cy="527" r="44" fill="#2a4a53"/>
  <circle cx="524" cy="521" r="21" fill="#eed2a2"/>
  <!-- Four restrained bolts finish the watertight frame without a fine-detail texture. -->
  <g fill="#4e7077">
    <circle cx="269" cy="298" r="8"/>
    <circle cx="755" cy="298" r="8"/>
    <circle cx="269" cy="750" r="8"/>
    <circle cx="755" cy="750" r="8"/>
  </g>
</svg>
